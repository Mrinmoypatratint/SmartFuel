name: CD - Deploy to Staging Environment

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if git ref is unchanged'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  pre-deploy-validation:
    name: Pre-Flight Safety & Data Preservation Check
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Environment Secrets Configuration
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          echo "Auditing Staging deployment credentials..."
          MISSING=0
          if [ -z "$STAGING_HOST" ]; then echo "Missing secret: STAGING_HOST"; MISSING=1; fi
          if [ -z "$STAGING_USER" ]; then echo "Missing secret: STAGING_USER"; MISSING=1; fi
          if [ -z "$STAGING_SSH_KEY" ]; then echo "Missing secret: STAGING_SSH_KEY"; MISSING=1; fi
          if [ "$MISSING" -eq 1 ]; then
            echo "ERROR: Required staging deployment secrets are not configured in GitHub Repository Settings."
            echo "Please configure STAGING_HOST, STAGING_USER, and STAGING_SSH_KEY under Staging environment."
            exit 1
          fi
          echo "Pre-flight credential verification passed."

      - name: Validate Zero Data Loss Policies
        run: |
          echo "=== MANDATORY ZERO DATA LOSS CHECK ==="
          echo "1. Validating that no destructive database wipe commands exist in compose.yaml..."
          if grep -E 'down\s+-v|--volumes|rm\s+-rf\s+storage' compose.yaml; then
            echo "CRITICAL SAFETY VIOLATION: Found volume wipe or storage deletion flags in compose.yaml!"
            exit 1
          fi
          echo "2. Validating persistent volume declarations..."
          if ! grep -q 'postgres_data:' compose.yaml || ! grep -q 'private_files:' compose.yaml; then
            echo "CRITICAL SAFETY VIOLATION: Required persistent volumes are missing from compose.yaml!"
            exit 1
          fi
          echo "Zero Data Loss policy validated: All volumes and storage are persistent."

  deploy-staging:
    name: Execute Staging Deployment with Pre-Flight Backup
    runs-on: ubuntu-latest
    needs: [pre-deploy-validation]
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Execute Zero-Downtime Deployment with Pre-Backup
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH || '/opt/smartfuel-anpr-staging' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Connecting to Staging host: $STAGING_USER@$STAGING_HOST..."
          ssh $STAGING_USER@$STAGING_HOST "bash -s" << 'EOF'
            set -euo pipefail
            DEPLOY_DIR="${DEPLOY_PATH:-/opt/smartfuel-anpr-staging}"
            echo "Target Directory: $DEPLOY_DIR"
            
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Initializing staging directory at $DEPLOY_DIR..."
              sudo mkdir -p "$DEPLOY_DIR"
              sudo chown -R $(whoami):$(whoami) "$DEPLOY_DIR"
            fi
            
            cd "$DEPLOY_DIR"
            
            # STEP 1: PRE-FLIGHT IMMUTABLE HOT BACKUP (ZERO DATA LOSS MANDATE)
            if [ -f "compose.yaml" ] && docker compose ps --status running -q >/dev/null 2>&1; then
              echo "Creating pre-deployment database and storage backup..."
              mkdir -p private-backups
              bash ops/backup.sh "$DEPLOY_DIR/private-backups" || echo "Warning: Backup script finished with non-fatal notice"
              echo "Backup created successfully before any code change."
            else
              echo "Notice: First-time deployment or containers not yet running; skipping hot dump."
            fi
            
            # STEP 2: RECORD PREVIOUS DEPLOYED COMMIT (FOR INSTANT ROLLBACK)
            if git rev-parse HEAD >/dev/null 2>&1; then
              PREV_SHA=$(git rev-parse HEAD)
              echo "$PREV_SHA" > .previous_known_good_commit
              echo "Recorded previous known-good commit: $PREV_SHA"
            fi
            
            # STEP 3: UPDATE CODE SAFELY
            if [ -d ".git" ]; then
              echo "Pulling latest code for SHA: $COMMIT_SHA..."
              git fetch origin main
              git checkout -f main
              git reset --hard origin/main
            else
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git .
              git checkout -f main
            fi
            
            # STEP 4: VERIFY NON-DESTRUCTIVE DATABASE ENVIRONMENT
            if [ ! -f ".env" ]; then
              echo "WARNING: .env not found. Copying .env.example (requires secret population)..."
              cp .env.example .env
              chmod 600 .env
            fi
            
            # STEP 5: BUILD & RESTART CONTAINERS SAFELY (PRESERVE VOLUMES)
            echo "Executing docker compose update..."
            docker compose build --pull
            docker compose up -d --remove-orphans
            
            echo "Deployment executed. Awaiting container health stabilization..."
            sleep 10
            docker compose ps
          EOF

  staging-smoke-tests:
    name: Staging Health Verification & Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: staging
    steps:
      - name: Verify Staging HTTP Health & Service Endpoints
        env:
          STAGING_URL: ${{ vars.STAGING_URL || format('http://{0}:8000', secrets.STAGING_HOST) }}
        run: |
          echo "Running health checks against Staging URL: $STAGING_URL..."
          HEALTH_URL="$STAGING_URL/api/health"
          
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=5
          SUCCESS=0
          
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Probe attempt $i of $MAX_ATTEMPTS to $HEALTH_URL..."
            HTTP_CODE=$(curl -s -o /tmp/health_resp.json -w "%{http_code}" "$HEALTH_URL" || echo "ERR")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "SUCCESS: Staging health check returned HTTP 200!"
              cat /tmp/health_resp.json
              SUCCESS=1
              break
            fi
            echo "Endpoint returned $HTTP_CODE, retrying in $SLEEP_SECONDS seconds..."
            sleep $SLEEP_SECONDS
          done
          
          if [ "$SUCCESS" -ne 1 ]; then
            echo "CRITICAL FAILURE: Staging health check failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

      - name: Verify Login & Static UI Delivery
        env:
          STAGING_URL: ${{ vars.STAGING_URL || format('http://{0}:8000', secrets.STAGING_HOST) }}
        run: |
          echo "Verifying UI login endpoint..."
          LOGIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/static/login.html" || echo "ERR")
          if [ "$LOGIN_STATUS" != "200" ]; then
            echo "WARNING: Login page returned HTTP $LOGIN_STATUS"
          else
            echo "Login interface verified: HTTP 200"
          fi
          echo "Staging smoke test suite completed successfully."
