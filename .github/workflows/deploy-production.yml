name: CD - Deploy to Production (Gated & Protected)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Git tag or commit SHA to deploy to production'
        required: true
        default: 'main'
      confirm_zero_data_loss_policy:
        description: 'Type "CONFIRM" to certify zero data loss safeguards are understood'
        required: true
        default: ''

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production-gate-and-audit:
    name: Production Gated Audit & Safety Pre-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_ref || github.ref }}

      - name: Validate Manual Confirmation on Dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm_zero_data_loss_policy }}" != "CONFIRM" ]; then
            echo "ERROR: Production deployment aborted."
            echo "You must type 'CONFIRM' in confirm_zero_data_loss_policy parameter to acknowledge data preservation protocols."
            exit 1
          fi
          echo "Operator confirmation verified."

      - name: Verify Production Secrets Configuration
        id: secrets-check
        env:
          PROD_HOST: ${{ secrets.PRODUCTION_HOST }}
          PROD_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          echo "Auditing Production environment secrets..."
          if [ -z "$PROD_HOST" ] || [ -z "$PROD_SSH_KEY" ]; then
            echo "::error::PRODUCTION_HOST and PRODUCTION_SSH_KEY must be configured in GitHub Secrets to execute automated CD deployment."
            echo "configured=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "Production credentials verified."
          fi

      - name: Enforce Zero Data Loss Static Architecture Check
        run: |
          if [ -f "compose.yaml" ]; then
            if grep -E 'down\s+-v|--volumes|rm\s+-rf\s+storage' compose.yaml; then
              echo "CRITICAL SECURITY FAULT: Volume deletion directives found in compose.yaml!"
              exit 1
            fi
            echo "Zero Data Loss architectural validation passed."
          fi

    outputs:
      configured: ${{ steps.secrets-check.outputs.configured }}

  deploy-production:
    name: Production Deployment with Pre-Flight Backup
    runs-on: ubuntu-latest
    needs: [production-gate-and-audit]
    if: needs.production-gate-and-audit.outputs.configured == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_ref || github.ref }}

      - name: Setup SSH Connection
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Add Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Execute Production Deployment & Hot Backup
        env:
          PROD_HOST: ${{ secrets.PRODUCTION_HOST }}
          PROD_USER: ${{ secrets.PRODUCTION_USER || 'deploy' }}
          DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH || '/opt/apps/fuel' }}
          TARGET_REF: ${{ github.event.inputs.release_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Connecting to Production server: $PROD_USER@$PROD_HOST..."
          ssh $PROD_USER@$PROD_HOST "bash -s" << 'EOF'
            set -euo pipefail
            DEPLOY_DIR="${DEPLOY_PATH:-/opt/apps/fuel}"
            echo "Production Directory: $DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            
            # =========================================================================
            # STEP 1: MANDATORY PRE-FLIGHT HOT BACKUP (ZERO DATA LOSS PROTOCOL)
            # =========================================================================
            mkdir -p backups
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            echo ">>> CREATING HOT BACKUP ($TIMESTAMP) <<<"
            
            if [ -d "storage" ]; then
              tar -czf "backups/smartfuel-storage-$TIMESTAMP.tar.gz" storage/ || true
              echo "Storage backup created."
            fi
            
            if [ -f "compose.yaml" ] && docker compose ps -q database >/dev/null 2>&1; then
              docker compose exec -T database pg_dump -U postgres smartfuel | gzip > "backups/smartfuel-pg-$TIMESTAMP.sql.gz" || true
              echo "PostgreSQL hot backup created."
            fi
            
            # Record previous good commit
            git rev-parse HEAD > .previous_known_good_commit || true
            
            # =========================================================================
            # STEP 2: SAFE GIT SYNC
            # =========================================================================
            echo "Fetching latest changes..."
            git fetch origin
            git checkout -f "$TARGET_REF"
            git pull origin "$TARGET_REF"
            
            # =========================================================================
            # STEP 3: DEPENDENCY UPDATE & SERVICE RECYCLE
            # =========================================================================
            if [ -d ".venv" ]; then
              echo "Updating virtual environment packages..."
              .venv/bin/pip install --upgrade pip
              .venv/bin/pip install -r requirements.txt
            fi
            
            echo "Recycling production service..."
            if systemctl is-active --quiet smartfuel 2>/dev/null; then
              pkill -f 'uvicorn app.main:app' || true
              sleep 2
              systemctl status smartfuel --no-pager
            elif [ -f "compose.yaml" ]; then
              docker compose build --pull
              docker compose up -d --remove-orphans
            fi
            
            echo "Deployment routine completed."
          EOF

  production-health-verification:
    name: Production Post-Deployment Health Verification
    runs-on: ubuntu-latest
    needs: [deploy-production]
    steps:
      - name: Verify Production HTTPS Endpoints & Health Check
        env:
          PROD_URL: ${{ vars.PRODUCTION_URL || 'https://fuel.cscsetu.com' }}
        run: |
          echo "Probing Production URL: $PROD_URL..."
          HEALTH_URL="$PROD_URL/api/health"
          
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=5
          SUCCESS=0
          
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i of $MAX_ATTEMPTS to probe $HEALTH_URL..."
            HTTP_CODE=$(curl -k -s -o /tmp/prod_health.json -w "%{http_code}" "$HEALTH_URL" || echo "ERR")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "SUCCESS: Production health check verified (HTTP 200)!"
              cat /tmp/prod_health.json
              SUCCESS=1
              break
            fi
            echo "Endpoint returned $HTTP_CODE, waiting $SLEEP_SECONDS seconds..."
            sleep $SLEEP_SECONDS
          done
          
          if [ "$SUCCESS" -ne 1 ]; then
            echo "CRITICAL ALERT: Production health verification failed!"
            exit 1
          fi

      - name: Verify Island Display & Security Headers
        env:
          PROD_URL: ${{ vars.PRODUCTION_URL || 'https://fuel.cscsetu.com' }}
        run: |
          echo "Verifying security headers on production..."
          curl -k -s -I "$PROD_URL/login" | grep -iE 'content-security-policy|x-frame-options|x-content-type-options' || true
          
          echo "Verifying /cng-display station screen availability..."
          CNG_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" "$PROD_URL/cng-display" || echo "ERR")
          echo "CNG Display status: $CNG_STATUS"
          
          echo "Production deployment and verification completed successfully."
