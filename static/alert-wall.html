<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SmartFuel — Station Alert Wall</title><link rel="stylesheet" href="/static/style.css"><style>
body{min-height:100vh;background:#f7fafc}.wall{max-width:1500px;margin:auto;padding:30px}.wall-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:26px}.wall-head h1{font-size:32px;margin:8px 0}.wall-meta{font-size:13px;color:#58738d}.wall-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}.wall-card{background:#fff;border:1px solid #dce7f2;border-left:8px solid #d45363;padding:22px;border-radius:16px;box-shadow:0 8px 28px #14304e10}.wall-card.missing{border-left-color:#d98b2b}.wall-card.unverified,.wall-card.not_registered{border-left-color:#4f86bb}.wall-plate{font-size:30px;font-weight:900;letter-spacing:1px;margin:12px 0}.wall-card .date{font-size:12px;color:#71869c}.wall-empty{grid-column:1/-1;padding:70px;text-align:center;background:#fff;border-radius:18px;border:1px solid #dce7f2;color:#56718d}
</style></head><body><main class="wall"><div class="wall-head"><div><div class="eyebrow">SMARTFUEL ANPR INTELLIGENCE · PILOT</div><h1>Station Certificate Alerts</h1><div class="wall-meta">Demonstration data only · No government verification or safety clearance</div></div><div><a href="/" class="btn outline">← Dashboard</a> <button class="btn secondary" id="refresh">Refresh now</button></div></div><div class="wall-meta" id="sync">Connecting…</div><div class="wall-list" id="cards" aria-live="polite"><div class="wall-empty">Loading recent alerts…</div></div></main><script src="/static/alert-wall.js" defer></script></body></html>
