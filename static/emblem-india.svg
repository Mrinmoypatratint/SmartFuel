<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="60" height="78" role="img" aria-label="State Emblem of India">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#85580C"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04127B"/>
      <stop offset="100%" stop-color="#020B4C"/>
    </linearGradient>
  </defs>
  
  <!-- Ashoka Lion Capital Stylized Silhouette (Official Golden Bronze) -->
  <g fill="url(#goldGrad)" stroke="#5B3E05" stroke-width="0.8">
    <!-- Top Plume / Main Center Lion Head -->
    <path d="M100 15 C92 15 85 22 84 32 C82 30 78 30 76 33 C72 38 74 46 76 50 C70 54 68 62 70 70 C72 78 80 84 88 88 L88 120 L112 120 L112 88 C120 84 128 78 130 70 C132 62 130 54 124 50 C126 46 128 38 124 33 C122 30 118 30 116 32 C115 22 108 15 100 15 Z" />
    <!-- Center Lion Mane Details -->
    <path d="M92 40 C95 36 105 36 108 40 C110 45 108 52 100 54 C92 52 90 45 92 40 Z" fill="#FBF3D5" opacity="0.3"/>
    <circle cx="94" cy="46" r="2.5" fill="#3A2402"/>
    <circle cx="106" cy="46" r="2.5" fill="#3A2402"/>
    <path d="M97 52 Q100 55 103 52" stroke="#3A2402" stroke-width="1.5" fill="none"/>

    <!-- Left Lion Head -->
    <path d="M60 38 C54 38 48 44 48 52 C44 55 42 62 44 68 C46 76 54 82 62 86 L70 120 L86 120 L80 86 C74 82 72 74 72 68 C72 62 74 58 76 54 C74 46 68 38 60 38 Z"/>
    <circle cx="58" cy="56" r="2" fill="#3A2402"/>
    <path d="M54 64 Q58 66 62 64" stroke="#3A2402" stroke-width="1" fill="none"/>

    <!-- Right Lion Head -->
    <path d="M140 38 C146 38 152 44 152 52 C156 55 158 62 156 68 C154 76 146 82 138 86 L130 120 L114 120 L120 86 C126 82 128 74 128 68 C128 62 126 58 124 54 C126 46 132 38 140 38 Z"/>
    <circle cx="142" cy="56" r="2" fill="#3A2402"/>
    <path d="M138 64 Q142 66 146 64" stroke="#3A2402" stroke-width="1" fill="none"/>

    <!-- Lion Front Paws & Chest -->
    <rect x="78" y="90" width="14" height="32" rx="3"/>
    <rect x="108" y="90" width="14" height="32" rx="3"/>
    <rect x="94" y="94" width="12" height="28" rx="2"/>

    <!-- Abacus Platform Base -->
    <path d="M30 122 L170 122 C174 122 176 126 174 130 L166 148 C164 152 160 154 156 154 L44 154 C40 154 36 152 34 148 L26 130 C24 126 26 122 30 122 Z"/>
  </g>

  <!-- Dharma Chakra on Abacus (Central Wheel of Law) -->
  <g transform="translate(100, 138)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#04127B" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#04127B"/>
    <!-- 24 Spokes (Represented cleanly with 12 crossed lines) -->
    <g stroke="#04127B" stroke-width="1">
      <line x1="0" y1="-12" x2="0" y2="12"/>
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="-8.5" y1="-8.5" x2="8.5" y2="8.5"/>
      <line x1="-8.5" y1="8.5" x2="8.5" y2="-8.5"/>
      <line x1="-11" y1="-4.6" x2="11" y2="4.6"/>
      <line x1="-11" y1="4.6" x2="11" y2="-4.6"/>
      <line x1="-4.6" y1="-11" x2="4.6" y2="11"/>
      <line x1="-4.6" y1="11" x2="4.6" y2="-11"/>
    </g>
  </g>

  <!-- Galloping Horse (Left) & Energetic Bull (Right) on Abacus -->
  <g fill="#5B3E05" opacity="0.85">
    <!-- Bull on right -->
    <path d="M140 134 C136 132 134 136 134 140 C134 144 142 144 146 142 L150 146 L154 146 L150 138 C148 134 144 134 140 134 Z"/>
    <!-- Horse on left -->
    <path d="M60 134 C64 132 66 136 66 140 C66 144 58 144 54 142 L50 146 L46 146 L50 138 C52 134 56 134 60 134 Z"/>
  </g>

  <!-- Bell-shaped Inverted Lotus Base -->
  <g fill="url(#goldGrad)" stroke="#5B3E05" stroke-width="0.8">
    <path d="M40 156 C40 156 50 178 70 186 C85 192 115 192 130 186 C150 178 160 156 160 156 L154 156 C144 172 130 180 100 180 C70 180 56 172 46 156 Z"/>
    <!-- Lower Base Bar -->
    <rect x="36" y="188" width="128" height="8" rx="2" fill="url(#goldGrad)"/>
    <rect x="28" y="198" width="144" height="6" rx="2" fill="url(#goldGrad)"/>
  </g>

  <!-- National Motto: सत्यमेव जयते (Satyameva Jayate in Devanagari) -->
  <text x="100" y="228" font-family="'Noto Sans Devanagari', 'Mukta', 'Mangal', 'Arial', sans-serif" font-size="21" font-weight="900" fill="#04127B" text-anchor="middle" letter-spacing="1.5">सत्यमेव जयते</text>
  <text x="100" y="246" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="800" fill="#5B3E05" text-anchor="middle" letter-spacing="1.2">GOVERNMENT OF INDIA</text>
</svg>
