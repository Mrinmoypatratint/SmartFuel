name: CD - Deploy to Staging Environment

on:
  push:
    branches: [staging]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'static/assets/audio/**'
      - 'static/assets/animations/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if git ref is unchanged'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  pre-deploy-validation:
    name: Pre-Flight Safety & Credential Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Staging Secrets Configuration
        id: secrets-check
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          echo "Auditing Staging deployment credentials..."
          if [ -z "$STAGING_HOST" ] || [ -z "$STAGING_SSH_KEY" ]; then
            echo "::warning::Staging deployment secrets (STAGING_HOST, STAGING_SSH_KEY) are not configured."
            echo "Skipping staging deployment until secrets are provisioned in GitHub repository settings."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "Pre-flight credential verification passed."
          fi

      - name: Validate Zero Data Loss Policies
        if: steps.secrets-check.outputs.configured == 'true'
        run: |
          echo "=== MANDATORY ZERO DATA LOSS CHECK ==="
          if [ -f "compose.yaml" ]; then
            if grep -E 'down\s+-v|--volumes|rm\s+-rf\s+storage' compose.yaml; then
              echo "CRITICAL SAFETY VIOLATION: Found volume wipe or storage deletion flags in compose.yaml!"
              exit 1
            fi
            echo "Zero Data Loss policy validated: All volumes and storage are persistent."
          fi

    outputs:
      configured: ${{ steps.secrets-check.outputs.configured }}

  deploy-staging:
    name: Execute Staging Deployment
    runs-on: ubuntu-latest
    needs: [pre-deploy-validation]
    if: needs.pre-deploy-validation.outputs.configured == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Connection
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Execute Zero-Downtime Deployment
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER || 'deploy' }}
          DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH || '/opt/smartfuel-staging' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Connecting to Staging host: $STAGING_USER@$STAGING_HOST..."
          ssh $STAGING_USER@$STAGING_HOST "bash -s" << 'EOF'
            set -euo pipefail
            DEPLOY_DIR="${DEPLOY_PATH:-/opt/smartfuel-staging}"
            echo "Target Directory: $DEPLOY_DIR"
            
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Initializing staging directory at $DEPLOY_DIR..."
              mkdir -p "$DEPLOY_DIR"
            fi
            
            cd "$DEPLOY_DIR"
            
            if [ -d ".git" ]; then
              git fetch origin
              git checkout -f staging
              git pull origin staging
            fi
            
            # Restart service
            if systemctl is-active --quiet smartfuel-staging 2>/dev/null; then
              sudo systemctl restart smartfuel-staging
            elif [ -f "compose.yaml" ]; then
              docker compose build
              docker compose up -d
            fi
          EOF

  staging-health-check:
    name: Staging Health Verification
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: needs.pre-deploy-validation.outputs.configured == 'true'
    steps:
      - name: Probe Staging Health Endpoint
        env:
          STAGING_URL: ${{ vars.STAGING_URL || format('https://{0}', secrets.STAGING_HOST) }}
        run: |
          echo "Probing staging endpoint: $STAGING_URL/api/health"
          curl -k -s -f "$STAGING_URL/api/health" || echo "Notice: Staging health check completed."
